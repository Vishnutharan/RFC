name: rfc-local

# Local development only. Production is deployed through the Kubernetes and
# Terraform definitions under infrastructure/.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfc
      POSTGRES_USER: rfc_local
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local development}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfc_local -d rfc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
      ConnectionStrings__RfcDatabase: "Host=db;Port=5432;Database=rfc;Username=rfc_local;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local development}"
      Redis__ConnectionString: redis:6379,abortConnect=false
      Cors__AllowedOrigins: http://localhost:3000,http://127.0.0.1:3000
      PublicAppUrl: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5242:8080"

  web:
    build:
      context: .
    depends_on:
      - app
    ports:
      - "3000:8080"

volumes:
  postgres_data:
  redis_data:
