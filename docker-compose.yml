services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rfc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfc"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RfcDatabase: Host=db;Port=5432;Database=rfc;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Cors__AllowedOrigins: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5242:8080"

  web:
    build:
      context: .
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  postgres_data:
