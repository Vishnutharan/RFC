apiVersion: batch/v1
kind: Job
metadata:
  generateName: rfc-database-migration-
  labels:
    app.kubernetes.io/name: rfc-backend
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: rfc-watford
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rfc-backend
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: rfc-watford
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Release automation must replace only this digest placeholder.
          image: ghcr.io/rfc-watford/rfc-backend@sha256:REPLACE_WITH_APPROVED_64_CHARACTER_DIGEST
          imagePullPolicy: IfNotPresent
          args:
            - --migrate-only
          envFrom:
            - configMapRef:
                name: rfc-backend-config
            - secretRef:
                name: rfc-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
