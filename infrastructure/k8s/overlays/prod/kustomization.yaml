apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rfc-prod

resources:
  - ../../base

images:
  - name: rfc-backend
    newName: ghcr.io/rfc-watford/rfc-backend
    newTag: prod
  - name: rfc-frontend
    newName: ghcr.io/rfc-watford/rfc-frontend
    newTag: prod

patches:
  - path: configmap-backend.patch.yaml
  - path: external-secret-backend.patch.yaml
  - path: ingress.patch.yaml
